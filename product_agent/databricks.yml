# This is a Declarative Automation Bundle definition for product_agent.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: product_agent
  uuid: a219e52e-2aa6-462c-a73f-f980abea4f3b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-959724eb-7cf3.cloud.databricks.com
    variables:
      catalog: product_agent
      schema: product_schema
  prod:
    mode: production
    workspace:
      host: https://dbc-959724eb-7cf3.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/idowusangotade082@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/idowusangotade082@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: product_agent
      schema: product_schema
    permissions:
      - user_name: idowusangotade082@gmail.com
        level: CAN_MANAGE
